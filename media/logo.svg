<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#2a2238"/>
      <stop offset="1" stop-color="#120e1a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.5" stop-color="#d9a43a"/>
      <stop offset="1" stop-color="#8a5a1c"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1622"/>
      <stop offset="1" stop-color="#0d0a12"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2c14e" stop-opacity="0.55"/>
      <stop offset="0.75" stop-color="#ffe7a3" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#f2c14e" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="die" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf6ea"/>
      <stop offset="1" stop-color="#d9cfb8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- the panel: a gold-trimmed frame -->
  <rect x="58" y="92" width="330" height="330" rx="22" fill="url(#gold)"/>
  <rect x="68" y="102" width="310" height="310" rx="15" fill="url(#panel)"/>
  <rect x="68" y="102" width="310" height="44" rx="15" fill="#2b2333"/>
  <rect x="68" y="130" width="310" height="16" fill="#2b2333"/>
  <rect x="150" y="117" width="146" height="12" rx="6" fill="#d9a43a" opacity="0.9"/>

  <!-- three roll rows: the winner lit gold, then two more -->
  <rect x="88" y="168" width="270" height="64" rx="10" fill="url(#win)"/>
  <rect x="88" y="168" width="270" height="64" rx="10" fill="none" stroke="#ffe08a" stroke-width="4"/>
  <circle cx="122" cy="200" r="17" fill="#1a1420"/>
  <path d="M112 200 l7 8 l14 -16" fill="none" stroke="#ffe08a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="152" y="190" width="120" height="20" rx="10" fill="#1a1420"/>
  <rect x="290" y="186" width="50" height="28" rx="8" fill="#1a1420"/>

  <rect x="88" y="248" width="270" height="56" rx="10" fill="#241d2c"/>
  <circle cx="122" cy="276" r="14" fill="#5b8fd9"/>
  <rect x="152" y="267" width="104" height="18" rx="9" fill="#5a5064"/>
  <rect x="290" y="263" width="50" height="26" rx="8" fill="#3a3144"/>

  <rect x="88" y="318" width="270" height="56" rx="10" fill="#241d2c"/>
  <circle cx="122" cy="346" r="14" fill="#6fbf5a"/>
  <rect x="152" y="337" width="88" height="18" rx="9" fill="#5a5064"/>
  <rect x="290" y="333" width="50" height="26" rx="8" fill="#3a3144"/>

  <!-- a die, tumbling in from the right -->
  <g transform="rotate(14 392 160)">
    <rect x="322" y="90" width="140" height="140" rx="26" fill="url(#die)" stroke="#8a5a1c" stroke-width="6"/>
    <g fill="#2a2238">
      <circle cx="356" cy="124" r="13"/>
      <circle cx="392" cy="160" r="13"/>
      <circle cx="428" cy="196" r="13"/>
      <circle cx="428" cy="124" r="13"/>
      <circle cx="356" cy="196" r="13"/>
    </g>
  </g>

  <!-- small sparkles from the winner -->
  <path d="M430 300 l6 16 l16 6 l-16 6 l-6 16 l-6 -16 l-16 -6 l16 -6 z" fill="#ffe08a"/>
  <path d="M452 372 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z" fill="#ffe08a" opacity="0.7"/>
</svg>
